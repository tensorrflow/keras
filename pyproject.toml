[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kerras"
version = "0.1.1"
description = "Personal Deep Learning code snippets"
readme = "README.md"
requires-python = ">=3.7"

[tool.setuptools]
packages = ["kerras"]
include-package-data = true

[tool.setuptools.package-data]
kerras = ["codes/*.txt", "codes/*.pdf"]
